# The whole system on one machine.
#
#   cp .env.example .env        (first time only)
#   docker compose up -d --build
#   cd scripts/smoke && npm install && node smoke.js
#
# Public ports: gateway http://localhost:8080, notification ws://localhost:8084
# Ops ports (/healthz, /readyz, /metrics): wallet 9090, gateway 9091, ledger 9095, fraud 9096, notification 9097

x-app: &app
  restart: unless-stopped

services:
  # ---------------- infrastructure ----------------

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: wallet
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d wallet"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two addresses: containers use kafka:9092, your terminal uses localhost:29092
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # One-shot job: create topics, then exit.
  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:9092
    volumes:
      - ./scripts/create-topics.sh:/scripts/create-topics.sh:ro

  # One-shot job: apply database migrations, then exit.
  flyway:
    image: flyway/flyway:13.7.0-alpine
    depends_on:
      postgres:
        condition: service_healthy
    command: -url=jdbc:postgresql://postgres:5432/wallet -user=app -password=${POSTGRES_PASSWORD:-app} -locations=filesystem:/flyway/migrations -connectRetries=10 migrate
    volumes:
      - ./db/migrations:/flyway/migrations:ro

  # ---------------- application ----------------
  # Every service starts only after migrations ran and topics exist.

  wallet:
    <<: *app
    build:
      context: .
      dockerfile: services/wallet/Dockerfile
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-app}@postgres:5432/wallet?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    ports:
      - "50051:50051"
      - "9090:9090"
    depends_on:
      flyway:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  gateway:
    <<: *app
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-app}@postgres:5432/wallet?sslmode=disable
      REDIS_URL: redis://redis:6379
      WALLET_GRPC_ADDR: wallet:50051
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
      - "9091:9090"
    depends_on:
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      wallet:
        condition: service_started

  ledger:
    <<: *app
    build:
      context: services/ledger
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-app}@postgres:5432/wallet?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    ports:
      - "9095:9090"
    depends_on:
      flyway:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  fraud:
    <<: *app
    build:
      context: services/fraud
    environment:
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
    ports:
      - "9096:9090"
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  notification:
    <<: *app
    build:
      context: services/notification
    environment:
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8084:8084"
      - "9097:9090"
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  pgdata: