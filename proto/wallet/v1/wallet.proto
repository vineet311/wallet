syntax = "proto3";

package wallet.v1;

option go_package = "github.com/Utkarsh-262003/wallet-ledger/gen/wallet/v1;walletv1";

// The contract between the gateway and the wallet service.
// Amounts are integer minor units (cents). Never floats for money.
service WalletService {
  // Creates the wallet for a user. Safe to call twice: returns the existing wallet.
  rpc CreateWallet(CreateWalletRequest) returns (CreateWalletResponse);
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse);
  rpc Deposit(DepositRequest) returns (DepositResponse);
  rpc Transfer(TransferRequest) returns (TransferResponse);
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);
}

message Wallet {
  string id = 1;
  string user_id = 2;
  int64 balance_cents = 3;
  string currency = 4;
  int32 version = 5;
  string created_at = 6;
}

message Transaction {
  string id = 1;
  string kind = 2;            // DEPOSIT or TRANSFER
  string from_wallet_id = 3;  // empty for deposits
  string to_wallet_id = 4;
  int64 amount_cents = 5;
  string status = 6;          // COMPLETED
  string idempotency_key = 7;
  string created_at = 8;
}

message CreateWalletRequest {
  string user_id = 1;
}

message CreateWalletResponse {
  Wallet wallet = 1;
}

message GetWalletRequest {
  string user_id = 1;
}

message GetWalletResponse {
  Wallet wallet = 1;
}

message DepositRequest {
  string user_id = 1;
  int64 amount_cents = 2;
  string idempotency_key = 3;
}

message DepositResponse {
  Transaction transaction = 1;
}

message TransferRequest {
  string user_id = 1;        // the sender; the wallet is looked up from this
  string to_wallet_id = 2;
  int64 amount_cents = 3;
  string idempotency_key = 4;
}

message TransferResponse {
  Transaction transaction = 1;
}

message GetTransactionRequest {
  string user_id = 1;
  string transaction_id = 2;
}

message GetTransactionResponse {
  Transaction transaction = 1;
}