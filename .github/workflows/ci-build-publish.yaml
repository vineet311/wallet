name: CI Build & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Go services: Dockerfile expects repository root as context
          - service: gateway
            context: .
            dockerfile: services/gateway/Dockerfile

          - service: wallet
            context: .
            dockerfile: services/wallet/Dockerfile

          # These services use their own directory as context
          - service: ledger
            context: services/ledger
            dockerfile: services/ledger/Dockerfile

          - service: fraud
            context: services/fraud
            dockerfile: services/fraud/Dockerfile

          - service: notification
            context: services/notification
            dockerfile: services/notification/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}

          platforms: linux/amd64,linux/arm64

          push: true

          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

